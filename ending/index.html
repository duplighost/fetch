<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>FETCH — The True Ending</title>
<!--
  THE CODA. Alex made this rhythm game with Grok; this page is a port of it,
  not a redesign. Every word on it is his. What changed is the plumbing: React,
  Tailwind, TanStack, the p2p multiplayer, the auth and the database are gone
  ("lol, p2p multipleayer. we dont need that stuff"), and what is left is plain
  ES modules served by FETCH's own two-page static server. No build step.

  It is a SEPARATE PAGE on purpose. Arriving here drops FETCH's entire Three.js
  scene, every linked program and every texture in one go, so the two games
  never coexist and there is nothing to tear down by hand.

  Two things this page owes the player that the framework used to hand it:
    1. Its own press-to-begin. User activation does not survive a navigation,
       so the AudioContext cannot start itself on arrival — the title screen's
       button is the gesture, and it is the only place audio is unlocked.
    2. A way back. The ending click used to reload FETCH and was the only exit;
       now that it comes here instead, the door is the quiet link, top-left.
-->
<style>
  :root {
    color-scheme: dark;
    /* FETCH's palette, from its index.html. The seam between the two games
       should not feel like two different products. */
    --paper: #eee9de;
    --ash: #aaa79f;
    --subtle: #88867f;
    --coal: #08090a;
    --iron: #34312d;
    --bruise: #17191b;
    --old-gold: #a4916d;
    --rule: rgba(238, 233, 222, .32);
    --rule-lit: rgba(238, 233, 222, .62);
    /* His lane colours, unchanged — they are the game's identity, and they are
       backed by position and shape, never carried by hue alone. */
    --lane-l: #e07070;
    --lane-d: #6ec8d4;
    --lane-u: #8dcf7a;
    --lane-r: #d4b46a;
    /* FETCH's type: a serif for the display voice, the system UI face for
       controls, mono for numerals. Nothing is downloaded. */
    --serif: Georgia, 'Times New Roman', serif;
    --ui: 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--coal); color: var(--paper);
    font-family: var(--ui); overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  button:not(:disabled) { cursor: pointer; }
  a { color: inherit; }

  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* ---- the three clips ---- */
  .clip {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .5s ease;
    pointer-events: none; background: var(--coal);
  }
  .clip.on { opacity: 1; }
  #clipStage, #clipSpin { object-position: center 20%; }

  /* His two scrims: one across, one up from the floor. */
  #scrimSide {
    position: absolute; inset: 0; pointer-events: none; transition: opacity .3s ease;
    background: linear-gradient(90deg, rgba(8, 9, 10, .8), rgba(8, 9, 10, .35) 55%, rgba(8, 9, 10, .2));
  }
  #scrimEdge {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(0deg, var(--coal), transparent 52%, rgba(8, 9, 10, .4));
  }
  body[data-screen="title"] #scrimSide { opacity: 1; }
  body[data-screen="playing"] #scrimSide,
  body[data-screen="bridge"] #scrimSide { opacity: .7; }
  body[data-screen="paused"] #scrimSide,
  body[data-screen="results"] #scrimSide { opacity: .4; }

  #field {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; pointer-events: none;
  }
  body[data-screen="playing"] #field { pointer-events: auto; }

  /* ---- the door back to FETCH ---- */
  #back {
    position: absolute; z-index: 14;
    top: max(1rem, env(safe-area-inset-top)); left: max(1rem, env(safe-area-inset-left));
    display: inline-flex; align-items: baseline; gap: .5rem;
    padding: .5rem .8rem; border: 1px solid rgba(238, 233, 222, .22);
    background: rgba(5, 6, 7, .5); color: var(--ash);
    font: 650 .62rem/1 var(--ui); letter-spacing: .19em; text-transform: uppercase;
    text-decoration: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }
  #back:hover { color: var(--paper); border-color: var(--rule-lit); background: rgba(9, 10, 10, .78); }
  #back .mark { font: 400 1rem/1 var(--serif); color: var(--old-gold); }
  body[data-screen="playing"] #back { display: none; }

  /* ---- HUD ---- */
  #hud {
    position: absolute; inset: 0 0 auto 0; z-index: 10; display: flex;
    align-items: flex-start; justify-content: space-between; gap: .75rem;
    padding: 1rem; padding-top: max(1rem, env(safe-area-inset-top));
    pointer-events: none;
  }
  #hud[hidden] { display: none; }
  #hudTrack {
    margin: 0; color: var(--ash);
    font: 500 .66rem/1.2 var(--mono); letter-spacing: .22em; text-transform: uppercase;
  }
  #hudScore {
    margin: .18rem 0 0; color: var(--paper); font: 400 2.6rem/.95 var(--serif);
    letter-spacing: .07em; font-variant-numeric: tabular-nums;
  }
  #hudPips { margin-top: .5rem; display: flex; gap: .28rem; width: 9rem; }
  #hudPips span { height: 2px; flex: 1; background: rgba(238, 233, 222, .16); }
  #hudPips span.done { background: var(--paper); }
  #hudGrin {
    margin-top: .5rem; width: 9rem; height: 5px; overflow: hidden;
    border: 1px solid rgba(238, 233, 222, .18); background: rgba(8, 9, 10, .6);
  }
  #hudGrinFill {
    height: 100%; width: 55%; background: var(--old-gold);
    transition: width .15s linear;
  }
  #hudGrinLabel {
    margin: .34rem 0 0; color: var(--subtle);
    font: 600 .58rem/1 var(--ui); letter-spacing: .22em; text-transform: uppercase;
  }
  #hudButtons { display: flex; gap: .5rem; pointer-events: auto; }

  /* ---- controls, in FETCH's hand ---- */
  .btn {
    appearance: none; border-radius: 2px; border: 1px solid rgba(238, 233, 222, .48);
    background: rgba(9, 10, 10, .62); color: var(--paper);
    font: 650 .68rem/1 var(--ui); letter-spacing: .16em; text-transform: uppercase;
    padding: .62rem .9rem; transition: background .16s ease, color .16s ease, border-color .16s ease;
  }
  .btn:hover { background: #d8d2c6; color: #111; border-color: #d8d2c6; }
  .btn.primary { background: var(--paper); color: #101110; border-color: var(--paper); }
  .btn.primary:hover { background: #d8d2c6; border-color: #d8d2c6; }
  .btn.wide { width: 100%; min-height: 3.25rem; padding: .8rem 1rem; }
  .btn.tiny { padding: .45rem .6rem; font-size: .6rem; letter-spacing: .14em; }
  .btn:focus-visible, #back:focus-visible, .pad:focus-visible {
    outline: 3px solid var(--paper); outline-offset: 4px;
    box-shadow: 0 0 0 7px rgba(7, 8, 9, .92);
  }

  /* ---- screens ---- */
  .screen { position: absolute; inset: 0; z-index: 12; }
  .screen[hidden] { display: none !important; }
  .card {
    width: min(28rem, 100%); padding: clamp(1.5rem, 4vw, 2.4rem);
    border: 1px solid var(--rule); border-top-color: var(--rule-lit);
    background: linear-gradient(145deg, rgba(18, 19, 19, .97), rgba(5, 6, 7, .98));
    box-shadow: 0 34px 90px rgba(0, 0, 0, .68);
  }
  .eyebrow {
    margin: 0; color: #d3cec3;
    font: 600 .66rem/1.4 var(--ui); letter-spacing: .3em; text-transform: uppercase;
  }
  .display { margin: 0; font-family: var(--serif); font-weight: 400; letter-spacing: .1em; }
  .quiet { color: var(--ash); }

  /* title */
  #title {
    display: flex; flex-direction: column;
    padding: max(1.5rem, env(safe-area-inset-top)) clamp(1.25rem, 5vw, 3.5rem) clamp(2rem, 6vh, 3.5rem);
  }
  #titleBody {
    margin-top: auto; display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: 2.5rem;
  }
  #titleWords { min-width: 0; }
  #titleWords .eyebrow { letter-spacing: .42em; color: var(--ash); }
  #wordmark {
    margin: .35rem 0 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(4.25rem, 20vw, 8.6rem); line-height: .82; letter-spacing: .105em;
    text-indent: -.02em; white-space: nowrap; text-shadow: 0 2px 18px #000, 0 1px 2px #000;
  }
  #subtitle {
    margin: .9rem 0 0; color: var(--ash); font-family: var(--serif);
    font-size: clamp(1.35rem, 3.4vw, 1.9rem); letter-spacing: .14em;
  }
  #titleBest {
    margin: .8rem 0 0; color: rgba(238, 233, 222, .82);
    font: 500 .72rem/1 var(--mono); letter-spacing: .08em;
  }
  #titleBest[hidden] { display: none; }
  #titlePlay { margin-top: 1.9rem; min-width: 15rem; min-height: 3.35rem; display: inline-flex; align-items: center; justify-content: space-between; gap: 2rem; }
  #titlePlay .mark { font: 400 1.35rem/1 var(--serif); color: var(--old-gold); }
  #titlePlay:hover .mark { color: #29251e; }

  /* key guide */
  #guide { flex: 0 0 auto; margin-left: auto; }
  #guide p {
    margin: 0 0 .7rem; text-align: right; color: var(--ash);
    font: 600 .64rem/1 var(--ui); letter-spacing: .35em; text-transform: uppercase;
  }
  .keypad { display: grid; grid-template-columns: repeat(3, auto); gap: .4rem; justify-content: end; }
  .keycap {
    width: 3rem; height: 3rem; display: grid; place-items: center;
    border: 1px solid currentColor; border-radius: 3px;
    background: rgba(9, 10, 10, .72); box-shadow: 0 5px 0 rgba(0, 0, 0, .5);
  }
  .keycap svg { width: 1.4rem; height: 1.4rem; }
  .l { color: var(--lane-l); } .d { color: var(--lane-d); }
  .u { color: var(--lane-u); } .r { color: var(--lane-r); }

  /* bridge */
  #bridge { display: flex; align-items: flex-end; justify-content: center; padding: 2rem 1.25rem 3.5rem; }
  #bridgeBody { width: min(34rem, 100%); text-align: center; }
  @media (min-width: 760px) {
    #bridge { align-items: center; padding-bottom: 2rem; }
    #bridgeBody { text-align: left; }
  }
  #bridgePart { color: var(--ash); letter-spacing: .35em; }
  #bridgeTitle { margin: .6rem 0 0; font-size: clamp(2.6rem, 9vw, 4rem); line-height: .95; }
  #bridgeTag { margin: .9rem 0 0; color: var(--ash); font-family: var(--serif); font-style: italic; font-size: 1.05rem; }

  /* pause */
  #pause {
    display: grid; place-items: center; padding: 1.25rem;
    background: rgba(3, 4, 5, .76);
    backdrop-filter: blur(9px) grayscale(.45); -webkit-backdrop-filter: blur(9px) grayscale(.45);
  }
  #pause h2 { font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: .95; letter-spacing: .14em; }
  #pauseCopy { margin: .8rem 0 1.8rem; color: var(--ash); font-family: var(--serif); font-style: italic; }
  .offset-label { margin: 0; color: var(--subtle); font: 600 .6rem/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; }
  .offset-row { margin-top: .7rem; display: flex; align-items: center; gap: .8rem; }
  #offsetValue { min-width: 5.5rem; text-align: center; font: 500 .85rem/1 var(--mono); font-variant-numeric: tabular-nums; }
  .stack { margin-top: 1.8rem; display: grid; gap: .6rem; }

  /* results */
  #results { display: grid; place-items: center; padding: 1.25rem; overflow-y: auto; }
  #resultsCard { max-height: calc(100dvh - 2.5rem); overflow-y: auto; }
  #resultGrade { margin: .2rem 0 0; font-size: clamp(4.5rem, 16vw, 6.5rem); line-height: .85; }
  #resultParts { margin: 1.6rem 0 0; padding: 0; list-style: none; }
  #resultParts li {
    display: flex; align-items: baseline; justify-content: space-between; gap: .9rem;
    padding-bottom: .6rem; margin-bottom: .6rem; border-bottom: 1px solid var(--rule);
  }
  #resultParts li:last-child { border-bottom: 0; margin-bottom: 0; }
  #resultParts .idx { margin: 0; color: var(--subtle); font: 500 .58rem/1 var(--mono); letter-spacing: .2em; }
  #resultParts .name { margin: .3rem 0 0; font-size: .95rem; }
  #resultParts .grade { margin: 0; font-family: var(--serif); font-size: 1.9rem; line-height: 1; letter-spacing: .08em; text-align: right; }
  #resultParts .pts { margin: .1rem 0 0; color: var(--ash); font: 500 .7rem/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  #resultTotals {
    margin: 1.3rem 0 0; display: grid; grid-template-columns: 1fr auto; gap: .3rem 1.5rem;
    font: 500 .82rem/1.5 var(--mono); font-variant-numeric: tabular-nums;
  }
  #resultTotals dt { color: var(--subtle); }
  #resultTotals dd { margin: 0; text-align: right; }
  #resultSaved { margin: 1rem 0 0; color: var(--subtle); font-size: .72rem; }

  /* count-in */
  #countin {
    position: absolute; inset: 0; z-index: 13; display: grid; place-items: center;
    pointer-events: none;
  }
  #countin[hidden] { display: none; }
  #countin p {
    margin: 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(5rem, 16vw, 8rem); line-height: 1; letter-spacing: .1em;
    text-shadow: 0 8px 24px rgba(0, 0, 0, .65);
  }

  /* touch pads */
  #pads {
    position: absolute; inset: auto 0 0 0; z-index: 11;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem;
    padding: .5rem .75rem max(.75rem, env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #pads[hidden] { display: none; }
  .pad {
    pointer-events: auto; height: 5rem; display: grid; place-items: center;
    border: 1px solid currentColor; border-radius: 4px;
    background: rgba(8, 9, 10, .35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .pad:active { background: rgba(238, 233, 222, .15); }
  .pad svg { width: 1.7rem; height: 1.7rem; }

  .rot-l, .rot-d, .rot-r { transform-origin: 50% 50%; }
  .rot-l { transform: rotate(-90deg); }
  .rot-d { transform: rotate(180deg); }
  .rot-r { transform: rotate(90deg); }

  @media (max-width: 759px) {
    #titleBody { gap: 1.6rem; }
    #guide { margin-left: 0; }
    #guide p { text-align: left; }
    .keypad { justify-content: start; }
    .keycap { width: 2.6rem; height: 2.6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body data-screen="title">

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
  </symbol>
</svg>

<div id="stage">
  <video id="clipClub" class="clip on" src="media/dancer-club.mp4" poster="media/dancer-club.jpg"
         muted loop playsinline autoplay preload="auto" disablepictureinpicture></video>
  <video id="clipStage" class="clip" src="media/dancer-stage.mp4" poster="media/dancer-stage.jpg"
         muted loop playsinline preload="auto" disablepictureinpicture></video>
  <video id="clipSpin" class="clip" src="media/dancer-spin.mp4" poster="media/dancer-spin.jpg"
         muted loop playsinline preload="auto" disablepictureinpicture></video>

  <div id="scrimSide"></div>
  <div id="scrimEdge"></div>

  <canvas id="field"></canvas>

  <a id="back" href="../"><span class="mark" aria-hidden="true">&#8630;</span><span>Back to FETCH</span></a>

  <div id="hud" hidden>
    <div id="hudLeft">
      <p id="hudTrack">1 / 4 &middot; CHOMP</p>
      <p id="hudScore">0</p>
      <div id="hudPips" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div id="hudGrin"><div id="hudGrinFill"></div></div>
      <p id="hudGrinLabel">Grin</p>
    </div>
    <div id="hudButtons">
      <button id="muteButton" class="btn tiny" type="button">Sound on</button>
      <button id="pauseButton" class="btn tiny" type="button">Pause</button>
    </div>
  </div>

  <div id="countin" hidden><p></p></div>

  <div id="pads" hidden>
    <button class="pad l" type="button" data-lane="0" aria-label="Left"><svg viewBox="0 0 24 24" class="rot-l"><use href="#arw"/></svg></button>
    <button class="pad d" type="button" data-lane="1" aria-label="Down"><svg viewBox="0 0 24 24" class="rot-d"><use href="#arw"/></svg></button>
    <button class="pad u" type="button" data-lane="2" aria-label="Up"><svg viewBox="0 0 24 24"><use href="#arw"/></svg></button>
    <button class="pad r" type="button" data-lane="3" aria-label="Right"><svg viewBox="0 0 24 24" class="rot-r"><use href="#arw"/></svg></button>
  </div>

  <section id="title" class="screen" aria-labelledby="wordmark">
    <div id="titleBody">
      <div id="titleWords">
        <p class="eyebrow">Dance with death</p>
        <h1 id="wordmark" class="display">FETCH</h1>
        <p id="subtitle">The True Ending</p>
        <p id="titleBest" hidden></p>
        <button id="titlePlay" class="btn primary" type="button">
          <span>Enter the floor</span><span class="mark" aria-hidden="true">&#8627;</span>
        </button>
      </div>
      <div id="guide">
        <p>How to play</p>
        <div class="keypad">
          <span></span>
          <div class="keycap u" aria-label="Up"><svg viewBox="0 0 24 24"><use href="#arw"/></svg></div>
          <span></span>
          <div class="keycap l" aria-label="Left"><svg viewBox="0 0 24 24" class="rot-l"><use href="#arw"/></svg></div>
          <div class="keycap d" aria-label="Down"><svg viewBox="0 0 24 24" class="rot-d"><use href="#arw"/></svg></div>
          <div class="keycap r" aria-label="Right"><svg viewBox="0 0 24 24" class="rot-r"><use href="#arw"/></svg></div>
        </div>
      </div>
    </div>
  </section>

  <section id="bridge" class="screen" hidden>
    <div id="bridgeBody">
      <p id="bridgePart" class="eyebrow"></p>
      <h2 id="bridgeTitle" class="display"></h2>
      <p id="bridgeTag"></p>
    </div>
  </section>

  <section id="pause" class="screen" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="card">
      <h2 id="pauseTitle" class="display">Paused</h2>
      <p id="pauseCopy">The skull is waiting. The beat is not.</p>
      <p class="offset-label">Audio offset</p>
      <div class="offset-row">
        <button id="offsetDown" class="btn" type="button">&minus;5</button>
        <span id="offsetValue">0 ms</span>
        <button id="offsetUp" class="btn" type="button">+5</button>
      </div>
      <div class="stack">
        <button id="resumeButton" class="btn primary wide" type="button">Resume</button>
        <button id="quitButton" class="btn wide" type="button">Quit to title</button>
      </div>
    </div>
  </section>

  <section id="results" class="screen" hidden role="dialog" aria-modal="true" aria-labelledby="resultGrade">
    <div id="resultsCard" class="card">
      <p class="eyebrow">The set</p>
      <p id="resultGrade" class="display"></p>
      <p class="quiet">Four movements. Four verdicts.</p>
      <ul id="resultParts"></ul>
      <dl id="resultTotals">
        <dt>Total</dt><dd id="resultTotal"></dd>
        <dt>Max combo</dt><dd id="resultCombo"></dd>
      </dl>
      <p id="resultSaved">Saved on this device.</p>
      <div class="stack">
        <button id="retryButton" class="btn primary wide" type="button">Dance again</button>
        <button id="titleButton" class="btn wide" type="button">Title</button>
      </div>
    </div>
  </section>
</div>

<script type="module" src="./game/main.js"></script>
</body>
</html>
